name: my-node-static-app-YML
"on":
  workflow_dispatch: {}
  push:
    branches:
    - main
env:
  artifact_name: drop
  node_version: 20.x
  build_dir: ${{ github.workspace }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Install Node.js
      uses: actions/setup-node@v4.0.0
      with:
        node-version: ${{ env.node_version }}
    - name: Install dependencies
      shell: bash
      run: |
        npm install
        echo "✅ Node modules installed"
    - name: Build the Node.js app
      shell: bash
      run: 'npm run build || echo "No build script defined, skipping..." '
    - name: Create ZIP Artifact
      run: |
        echo "Zipping the build output...Migrated using custom transformer"
        zip -r ${{ runner.temp }}/${{ github.run_id }}.zip ${{ env.build_dir }} -x *.git* node_modules/*
    - name: Upload Artifact drop
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: ${{ runner.temp }}/${{ github.run_id }}.zip

