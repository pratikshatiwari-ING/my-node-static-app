name: my-node-static-app-custom
"on":
  workflow_dispatch: {}
  push:
    branches:
    - main
env:
  system_debug: "false"
jobs:
  Job_1:
    name: Agent job 1
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Use Node 20.x
      uses: actions/setup-node@v4.0.0
      with:
        node-version: 20.x
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build || echo "No build script defined, skipping..."
    - name: Create ZIP Artifact
      run: |
        echo "Zipping the build output...Migrated using custom transformer"
        zip -r ${{ runner.temp }}/${{ github.run_id }}.zip . -x *.git* node_modules/*
    - name: Upload Artifact drop
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: ${{ runner.temp }}/${{ github.run_id }}.zip

